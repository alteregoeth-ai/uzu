
name: Uzu macOS test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Show hardware
        run: |
          uname -a
          system_profiler SPHardwareDataType
          xcodebuild -version
          xcrun -f metal

      - name: Build uzu CLI with Metal
        run: cargo build -p cli

      - name: Check CLI
        run: cargo run -p cli -- --help

      - name: Run model and test API
        shell: bash
        run: |
          set -e

          echo "Starting Uzu with Qwen 3.5 4B on Apple Silicon..."

          cargo run -p cli -- server \
            --model trymirai/Qwen3.5-4B-M \
            > uzu-server.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            echo ""
            echo "=== UZU SERVER LOG ==="
            cat uzu-server.log || true
          }
          trap cleanup EXIT

          echo "Waiting for model to download and load..."

          READY=false

          for i in {1..180}; do
            if curl -sf http://127.0.0.1:8000/v1/models > models.json; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server stopped unexpectedly."
              cat uzu-server.log
              exit 1
            fi

            echo "Still waiting... ($i/180)"
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "Server did not become ready."
            exit 1
          fi

          echo "Model is ready!"
          cat models.json

          echo ""
          echo "Sending prompt to Qwen..."

          curl --fail-with-body -sS \
            --max-time 600 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "alibaba:qwen3.5:4b:mirai:mirai-m:4",
              "messages": [
                {
                  "role": "user",
                  "content": "Explain how a transformer language model works in three simple sentences."
                }
              ],
              "stream": false,
              "max_tokens": 150
            }' | tee response.json

          echo ""
          echo "QWEN RESPONSE RECEIVED SUCCESSFULLY!"

      - name: Save logs and model response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzu-demo-logs
          path: |
            uzu-server.log
            models.json
            response.json
          if-no-files-found: ignore
