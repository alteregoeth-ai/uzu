
name: Uzu macOS test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Show hardware
        run: |
          uname -a
          system_profiler SPHardwareDataType

      - name: Build uzu CLI (CPU)
        run: cargo build -p cli --no-default-features --features cpu

      - name: Check CLI
        run: cargo run -p cli --no-default-features --features cpu -- --help

      - name: Run Qwen 0.8B and test API
        shell: bash
        run: |
          set -euo pipefail

          MODEL="alibaba:qwen3.5:0.8b:mirai:mirai-m:4"

          echo "Starting Uzu with Qwen 3.5 0.8B on Intel CPU..."

          cargo run -p cli --no-default-features --features cpu -- server \
            --model "$MODEL" \
            > uzu-server.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            echo ""
            echo "=== UZU SERVER LOG ==="
            cat uzu-server.log || true
          }
          trap cleanup EXIT

          echo "Waiting for model to load..."

          READY=false

          for i in {1..180}; do
            if curl -sf http://127.0.0.1:8000/v1/models > models.json; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server stopped unexpectedly."
              cat uzu-server.log
              exit 1
            fi

            echo "Still waiting... ($i/180)"
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "Server did not become ready."
            cat uzu-server.log
            exit 1
          fi

          echo ""
          echo "MODEL READY!"
          cat models.json

          echo ""
          echo "=== SENDING PROMPT TO QWEN ==="

          curl -N --fail-with-body -sS \
            --max-time 300 \
            http://127.0.0.1:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Explain how a transformer language model works in three simple sentences.\"
                }
              ],
              \"stream\": true,
              \"max_tokens\": 80
            }" | tee response.txt

          echo ""
          echo "=== QWEN RESPONSE COMPLETED ==="

      - name: Save logs and response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzu-demo-logs
          path: |
            uzu-server.log
            models.json
            response.txt
          if-no-files-found: ignore
