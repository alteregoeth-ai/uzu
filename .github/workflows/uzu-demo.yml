
name: Uzu macOS test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show hardware
        run: |
          uname -a
          system_profiler SPHardwareDataType
          xcodebuild -version
          xcrun -f metal

      - name: Build uzu CLI
        run: cargo build -p cli

      - name: Check CLI
        run: cargo run -p cli -- --help
